[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde_json = { workspace = true }
serde = { workspace = true }
log = "0.4"
tauri = { version = "2.10.3", features = ["devtools"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-os = "2"
tauri-plugin-android-mediastore = "0.2.0"
tauri-plugin-music-notification-api = { path = "../../tauri-plugin-music-notification" }
kaulan = { path = "../../backend", default-features = false }
tokio = { workspace = true }
base64 = "0.22"
async-trait = "0.1"
bytes = "1"
futures = "0.3"
jni = "0.21"

[target.'cfg(target_os = "android")'.dependencies]
ndk-context = "0.1"
