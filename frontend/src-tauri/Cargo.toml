[package]
name = "app"
version = "0.1.3"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde_json = { workspace = true }
serde = { workspace = true }
log = "0.4"
tauri = { version = "2.10.3", features = ["devtools"] }
tauri-plugin-mcp-bridge = "0.11.2"
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-os = "2"
tauri-plugin-android-mediastore = "0.2.2"
tauri-plugin-android-external-storage = "0.1"
tauri-plugin-music-notification-api = { path = "../../vendor/tauri-plugin-music-notification" }
kaulan = { path = "../../backend", default-features = false }
tokio = { workspace = true }
base64 = "0.22"
async-trait = "0.1"
bytes = "1"
futures = "0.3"
jni = "0.21"
netease-api = { path = "../../vendor/ncmdump-rs/netease-api" }
bilibili-api = { path = "../../vendor/ncmdump-rs/bilibili-api" }
ytdl-audio = { path = "../../vendor/ytdl-audio" }
url = "2"

[target.'cfg(target_os = "android")'.dependencies]
ndk-context = "0.1"
