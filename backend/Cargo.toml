[package]
name = "aural"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4"
serde = { version = "1.0", features = ["derive"] }
actix-cors = "0.7"
sea-orm = { version = "0.12", features = ["sqlx-sqlite", "runtime-actix-native-tls", "macros"] }
serde_json = "1.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
chrono = { version = "0.4", features = ["serde"] }

