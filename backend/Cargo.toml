[package]
name = "kaulan"
version = "0.1.0"
edition = "2021"

[lib]
name = "kaulan"
path = "src/lib.rs"

[[bin]]
name = "kaulan"
path = "src/main.rs"

[dependencies]
actix-web = { workspace = true }
actix-multipart = "0.7"
futures = "0.3"
serde = { workspace = true }
actix-cors = "0.7"
sea-orm = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
chrono = { workspace = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "5"
base64 = "0.22"
thiserror = "1"
async-trait = "0.1"

[dev-dependencies]
tempfile = "3"
