[workspace]
resolver = "2"
members = ["backend", "frontend/src-tauri"]

[workspace.dependencies]
actix-web = "4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
sea-orm = { version = "0.12", features = ["sqlx-sqlite", "runtime-actix-rustls", "macros"] }
chrono = { version = "0.4", features = ["serde"] }
