name: Publish

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to upload Android assets to, for example v0.1.4.
        required: false
        type: string
  release:
    types:
      - published
  push:
    branches: [ "master", "migrate-ffmpeg" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

env:
  FFMPEG_VERSION: 8.1.1
  RELEASE_TAG: ${{ github.event.release.tag_name || github.event.inputs.release_tag || github.ref_name }}
  CARGO_NET_RETRY: 5
  CARGO_HTTP_TIMEOUT: 120
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse

concurrency:
  group: publish-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test release inputs
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Install Linux FFmpeg source build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            ca-certificates \
            clang \
            curl \
            nasm \
            pkg-config \
            libmp3lame-dev \
            zlib1g-dev \
            xz-utils \
            yasm

      - name: Cache Linux FFmpeg build
        uses: actions/cache@v4
        with:
          path: .cache/ffmpeg-${{ env.FFMPEG_VERSION }}
          key: linux-ffmpeg-${{ env.FFMPEG_VERSION }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/ci-install-ffmpeg-linux.sh') }}

      - name: Build Linux FFmpeg ${{ env.FFMPEG_VERSION }}
        run: bash ./scripts/ci-install-ffmpeg-linux.sh

      - name: Clippy
        run: cargo clippy-ci -p kaulan -- -D warnings

      - name: Install local music notification package dependencies
        working-directory: vendor/tauri-plugin-music-notification
        run: npm ci

      - name: Build local music notification package
        working-directory: vendor/tauri-plugin-music-notification
        run: npm run build

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run backend tests
        run: >-
          cargo test -p kaulan --
          --skip test_update_database_adds_new_files_to_database
          --skip test_update_database_with_multiple_new_files
          --skip test_upload_files_then_check_database_via_api
          --skip test_upload_single_file_to_root
          --skip test_upload_to_subdirectory
          --skip test_upload_to_nested_subdirectories
          --skip test_upload_path_traversal_protection
          --skip test_upload_updates_database

      - name: Run frontend tests
        working-directory: frontend
        run: npm run test -- --run

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  release-desktop:
    if: github.event_name == 'release'
    name: Release desktop (${{ matrix.platform }})
    needs: test
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-24.04
          - platform: ubuntu-24.04-arm
          - platform: windows-latest
          - platform: windows-11-arm
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Windows vcpkg root
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: .cache/vcpkg
          key: windows-vcpkg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/setup-windows-vcpkg.ps1') }}

      - name: Install Windows FFmpeg build dependencies with vcpkg
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/setup-windows-vcpkg.ps1

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            ca-certificates \
            clang \
            curl \
            nasm \
            pkg-config \
            libmp3lame-dev \
            zlib1g-dev \
            xz-utils \
            yasm \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Cache Linux FFmpeg build
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: .cache/ffmpeg-${{ env.FFMPEG_VERSION }}
          key: linux-ffmpeg-${{ env.FFMPEG_VERSION }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/ci-install-ffmpeg-linux.sh') }}

      - name: Build Linux FFmpeg ${{ env.FFMPEG_VERSION }}
        if: runner.os == 'Linux'
        run: bash ./scripts/ci-install-ffmpeg-linux.sh

      - name: Install local music notification package dependencies
        working-directory: vendor/tauri-plugin-music-notification
        run: npm ci

      - name: Build local music notification package
        working-directory: vendor/tauri-plugin-music-notification
        run: npm run build

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build and upload desktop bundles
        uses: tauri-apps/tauri-action@v0.6.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: frontend
          releaseId: ${{ github.event.release.id }}
          tagName: ${{ github.event.release.tag_name }}

      # Convert the Tauri .deb into a pacman package (.pkg.tar.zst) so Arch
      # users can install via `pacman -U` instead of repackaging by hand.
      # Only the Linux legs of the matrix produce a .deb.
      - name: Install Arch packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get install -y zstd binutils

      - name: Build Arch Linux pacman package
        if: runner.os == 'Linux'
        run: ./build-arch.sh --no-build

      - name: Upload Arch Linux package
        if: runner.os == 'Linux'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            target/arch/kaulan-*.pkg.tar.zst

  release-android:
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    name: Release Android (${{ matrix.abi }})
    needs: test
    runs-on: ubuntu-24.04
    environment: android
    permissions:
      contents: write
    strategy:
      fail-fast: false
      # One APK per ABI instead of one ~100MB universal APK. Tauri always
      # assembles the "universal" Gradle flavor even with --target, so each leg
      # emits app-universal-release.apk containing only that ABI's libs; the
      # staging step below renames it per ABI so the legs don't collide.
      matrix:
        include:
          - short: aarch64
            rust_target: aarch64-linux-android
            abi: arm64-v8a
          - short: armv7
            rust_target: armv7-linux-androideabi
            abi: armeabi-v7a
          - short: x86_64
            rust_target: x86_64-linux-android
            abi: x86_64
    env:
      CI: 'true'
      JAVA_VERSION: '17'
      ANDROID_API_LEVEL: '35'
      ANDROID_BUILD_TOOLS: '35.0.0'
      ANDROID_NDK_VERSION: '27.0.12077973'
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache Android FFmpeg bundle (${{ matrix.short }})
        uses: actions/cache@v4
        with:
          path: build/android-ffmpeg
          key: android-ffmpeg-${{ env.FFMPEG_VERSION }}-${{ env.ANDROID_NDK_VERSION }}-${{ matrix.short }}-${{ hashFiles('scripts/build-android-ffmpeg.sh') }}
          restore-keys: |
            android-ffmpeg-${{ env.FFMPEG_VERSION }}-${{ env.ANDROID_NDK_VERSION }}-${{ matrix.short }}-

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-${ANDROID_API_LEVEL}" "build-tools;${ANDROID_BUILD_TOOLS}" "ndk;${ANDROID_NDK_VERSION}"

      - name: Install Android FFmpeg build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            ca-certificates \
            nasm \
            yasm

      - name: Build Android FFmpeg bundle (${{ matrix.short }})
        run: bash ./scripts/build-android-ffmpeg.sh --target ${{ matrix.short }}

      - name: Install local music notification package dependencies
        working-directory: vendor/tauri-plugin-music-notification
        run: npm ci

      - name: Build local music notification package
        working-directory: vendor/tauri-plugin-music-notification
        run: npm run build

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Android release package (${{ matrix.abi }})
        run: bash ./build-android.sh --target ${{ matrix.short }} --no-aab

      - name: List built APKs
        run: |
          find frontend/src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk' \
            -printf '%10s  %p\n' | sort -k2 || true

      - name: Stage per-ABI APK
        run: |
          set -euo pipefail
          src="frontend/src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk"
          dest="frontend/src-tauri/gen/android/app/build/outputs/kaulan-${{ matrix.abi }}.apk"
          test -f "$src"
          cp "$src" "$dest"
          ls -l "$dest"

      - name: Upload Android APK (${{ matrix.abi }})
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            frontend/src-tauri/gen/android/app/build/outputs/kaulan-${{ matrix.abi }}.apk
