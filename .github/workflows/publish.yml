name: Publish

on:
  workflow_dispatch:
  release:
    types:
      - published
  push:
    branches: [ "master", "migrate-ffmpeg" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

env:
  FFMPEG_VERSION: 8.1.1

concurrency:
  group: publish-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test release inputs
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux FFmpeg source build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            ca-certificates \
            clang \
            curl \
            nasm \
            pkg-config \
            libmp3lame-dev \
            zlib1g-dev \
            xz-utils \
            yasm

      - name: Cache Linux FFmpeg build
        uses: actions/cache@v4
        with:
          path: .cache/ffmpeg-${{ env.FFMPEG_VERSION }}
          key: linux-ffmpeg-${{ env.FFMPEG_VERSION }}-${{ runner.os }}-${{ hashFiles('scripts/ci-install-ffmpeg-linux.sh') }}

      - name: Build Linux FFmpeg ${{ env.FFMPEG_VERSION }}
        run: bash ./scripts/ci-install-ffmpeg-linux.sh

      - name: Install local music notification package dependencies
        working-directory: vendor/tauri-plugin-music-notification
        run: npm ci

      - name: Build local music notification package
        working-directory: vendor/tauri-plugin-music-notification
        run: npm run build

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run backend tests
        run: >-
          cargo test -p kaulan --
          --skip test_update_database_adds_new_files_to_database
          --skip test_update_database_with_multiple_new_files
          --skip test_upload_files_then_check_database_via_api
          --skip test_upload_single_file_to_root
          --skip test_upload_to_subdirectory
          --skip test_upload_to_nested_subdirectories
          --skip test_upload_path_traversal_protection
          --skip test_upload_updates_database

      - name: Run frontend tests
        working-directory: frontend
        run: npm run test -- --run

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  release-desktop:
    if: github.event_name == 'release'
    name: Release desktop (${{ matrix.platform }})
    needs: test
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-24.04
          - platform: windows-latest
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Windows FFmpeg ${{ env.FFMPEG_VERSION }} build dependencies
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $installRoot = Join-Path $env:RUNNER_TEMP "ffmpeg"
          $archive = Join-Path $env:RUNNER_TEMP "ffmpeg.7z"
          $url = "https://www.gyan.dev/ffmpeg/builds/packages/ffmpeg-$env:FFMPEG_VERSION-full_build-shared.7z"
          Invoke-WebRequest -Uri $url -OutFile $archive
          7z x $archive "-o$installRoot" -y
          $ffmpegRoot = Get-ChildItem $installRoot -Directory | Select-Object -First 1
          Copy-Item "$($ffmpegRoot.FullName)\lib\*.lib" "$($ffmpegRoot.FullName)\bin\"
          echo "FFMPEG_INCLUDE_DIR=$($ffmpegRoot.FullName)\include" >> $env:GITHUB_ENV
          echo "FFMPEG_LIBS_DIR=$($ffmpegRoot.FullName)\lib" >> $env:GITHUB_ENV
          echo "FFMPEG_DLL_PATH=$($ffmpegRoot.FullName)\bin" >> $env:GITHUB_ENV
          echo "FFMPEG_LINK_MODE=dynamic" >> $env:GITHUB_ENV
          echo "$($ffmpegRoot.FullName)\bin" >> $env:GITHUB_PATH

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            ca-certificates \
            clang \
            curl \
            nasm \
            pkg-config \
            libmp3lame-dev \
            zlib1g-dev \
            xz-utils \
            yasm \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Cache Linux FFmpeg build
        if: matrix.platform == 'ubuntu-24.04'
        uses: actions/cache@v4
        with:
          path: .cache/ffmpeg-${{ env.FFMPEG_VERSION }}
          key: linux-ffmpeg-${{ env.FFMPEG_VERSION }}-${{ runner.os }}-${{ hashFiles('scripts/ci-install-ffmpeg-linux.sh') }}

      - name: Build Linux FFmpeg ${{ env.FFMPEG_VERSION }}
        if: matrix.platform == 'ubuntu-24.04'
        run: bash ./scripts/ci-install-ffmpeg-linux.sh

      - name: Install local music notification package dependencies
        working-directory: vendor/tauri-plugin-music-notification
        run: npm ci

      - name: Build local music notification package
        working-directory: vendor/tauri-plugin-music-notification
        run: npm run build

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build and upload desktop bundles
        uses: tauri-apps/tauri-action@v0.6.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: frontend
          releaseId: ${{ github.event.release.id }}
          tagName: ${{ github.event.release.tag_name }}

  release-android:
    if: github.event_name == 'release'
    name: Release Android
    needs: test
    runs-on: ubuntu-24.04
    environment: android
    permissions:
      contents: write
    env:
      CI: 'true'
      JAVA_VERSION: '17'
      ANDROID_API_LEVEL: '35'
      ANDROID_BUILD_TOOLS: '35.0.0'
      ANDROID_NDK_VERSION: '27.0.12077973'
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Check Android FFmpeg bundle
        id: ffmpeg
        shell: bash
        run: |
          required_targets=(
            aarch64-linux-android
            armv7-linux-androideabi
            i686-linux-android
            x86_64-linux-android
          )

          missing=()
          if [ ! -f build/android-ffmpeg/android/binding.rs ]; then
            missing+=("build/android-ffmpeg/android/binding.rs")
          fi

          for target in "${required_targets[@]}"; do
            if [ ! -d "build/android-ffmpeg/android/${target}/lib" ]; then
              missing+=("build/android-ffmpeg/android/${target}/lib")
            fi
            if [ ! -d "build/android-ffmpeg/android/${target}/prefix/include" ]; then
              missing+=("build/android-ffmpeg/android/${target}/prefix/include")
            fi
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            {
              echo "Android release build skipped because staged FFmpeg files are missing:"
              printf -- "- %s\n" "${missing[@]}"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        if: steps.ffmpeg.outputs.available == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Java
        if: steps.ffmpeg.outputs.available == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Rust
        if: steps.ffmpeg.outputs.available == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Setup Android SDK
        if: steps.ffmpeg.outputs.available == 'true'
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        if: steps.ffmpeg.outputs.available == 'true'
        run: sdkmanager "platforms;android-${ANDROID_API_LEVEL}" "build-tools;${ANDROID_BUILD_TOOLS}" "ndk;${ANDROID_NDK_VERSION}"

      - name: Install local music notification package dependencies
        if: steps.ffmpeg.outputs.available == 'true'
        working-directory: vendor/tauri-plugin-music-notification
        run: npm ci

      - name: Build local music notification package
        if: steps.ffmpeg.outputs.available == 'true'
        working-directory: vendor/tauri-plugin-music-notification
        run: npm run build

      - name: Install frontend dependencies
        if: steps.ffmpeg.outputs.available == 'true'
        working-directory: frontend
        run: npm ci

      - name: Build Android release packages
        if: steps.ffmpeg.outputs.available == 'true'
        run: bash ./build-android.sh

      - name: Upload Android bundles to release
        if: steps.ffmpeg.outputs.available == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: |
            frontend/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
            frontend/src-tauri/gen/android/app/build/outputs/bundle/**/*.aab
