name: Publish

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to upload Android assets to, for example v0.1.4.
        required: false
        type: string
  release:
    types:
      - published
  push:
    branches: [ "master", "migrate-ffmpeg" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

env:
  FFMPEG_VERSION: 8.1.1
  RELEASE_TAG: ${{ github.event.release.tag_name || github.event.inputs.release_tag || github.ref_name }}
  CARGO_NET_RETRY: 5
  CARGO_HTTP_TIMEOUT: 120
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse

concurrency:
  group: publish-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test release inputs
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Install Linux FFmpeg source build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            ca-certificates \
            clang \
            curl \
            nasm \
            pkg-config \
            libmp3lame-dev \
            zlib1g-dev \
            xz-utils \
            yasm

      - name: Cache Linux FFmpeg build
        uses: actions/cache@v4
        with:
          path: .cache/ffmpeg-${{ env.FFMPEG_VERSION }}
          key: linux-ffmpeg-${{ env.FFMPEG_VERSION }}-${{ runner.os }}-${{ hashFiles('scripts/ci-install-ffmpeg-linux.sh') }}

      - name: Build Linux FFmpeg ${{ env.FFMPEG_VERSION }}
        run: bash ./scripts/ci-install-ffmpeg-linux.sh

      - name: Clippy
        run: >-
          cargo clippy -p kaulan --lib --bins --no-deps --
          -D warnings
          -D clippy::panic
          -D clippy::unwrap_used
          -D clippy::expect_used
          -D clippy::as_conversions
          -D clippy::arithmetic_side_effects
          -D clippy::cast_lossless
          -D clippy::exit
          -D clippy::implicit_clone
          -D clippy::indexing_slicing
          -D clippy::maybe_infinite_iter
          -D clippy::mem_forget
          -D clippy::needless_pass_by_value
          -D clippy::option_option
          -D clippy::wildcard_imports

      - name: Install local music notification package dependencies
        working-directory: vendor/tauri-plugin-music-notification
        run: npm ci

      - name: Build local music notification package
        working-directory: vendor/tauri-plugin-music-notification
        run: npm run build

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run backend tests
        run: >-
          cargo test -p kaulan --
          --skip test_update_database_adds_new_files_to_database
          --skip test_update_database_with_multiple_new_files
          --skip test_upload_files_then_check_database_via_api
          --skip test_upload_single_file_to_root
          --skip test_upload_to_subdirectory
          --skip test_upload_to_nested_subdirectories
          --skip test_upload_path_traversal_protection
          --skip test_upload_updates_database

      - name: Run frontend tests
        working-directory: frontend
        run: npm run test -- --run

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  release-desktop:
    if: github.event_name == 'release'
    name: Release desktop (${{ matrix.platform }})
    needs: test
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-24.04
          - platform: windows-latest
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Windows vcpkg root
        if: matrix.platform == 'windows-latest'
        uses: actions/cache@v4
        with:
          path: .cache/vcpkg
          key: windows-vcpkg-${{ runner.os }}-${{ hashFiles('scripts/setup-windows-vcpkg.ps1') }}

      - name: Install Windows FFmpeg build dependencies with vcpkg
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          ./scripts/setup-windows-vcpkg.ps1

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            ca-certificates \
            clang \
            curl \
            nasm \
            pkg-config \
            libmp3lame-dev \
            zlib1g-dev \
            xz-utils \
            yasm \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Cache Linux FFmpeg build
        if: matrix.platform == 'ubuntu-24.04'
        uses: actions/cache@v4
        with:
          path: .cache/ffmpeg-${{ env.FFMPEG_VERSION }}
          key: linux-ffmpeg-${{ env.FFMPEG_VERSION }}-${{ runner.os }}-${{ hashFiles('scripts/ci-install-ffmpeg-linux.sh') }}

      - name: Build Linux FFmpeg ${{ env.FFMPEG_VERSION }}
        if: matrix.platform == 'ubuntu-24.04'
        run: bash ./scripts/ci-install-ffmpeg-linux.sh

      - name: Install local music notification package dependencies
        working-directory: vendor/tauri-plugin-music-notification
        run: npm ci

      - name: Build local music notification package
        working-directory: vendor/tauri-plugin-music-notification
        run: npm run build

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build and upload desktop bundles
        uses: tauri-apps/tauri-action@v0.6.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: frontend
          releaseId: ${{ github.event.release.id }}
          tagName: ${{ github.event.release.tag_name }}

  release-android:
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    name: Release Android
    needs: test
    runs-on: ubuntu-24.04
    environment: android
    permissions:
      contents: write
    env:
      CI: 'true'
      JAVA_VERSION: '17'
      ANDROID_API_LEVEL: '35'
      ANDROID_BUILD_TOOLS: '35.0.0'
      ANDROID_NDK_VERSION: '27.0.12077973'
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache Android FFmpeg bundle
        uses: actions/cache@v4
        with:
          path: build/android-ffmpeg
          key: android-ffmpeg-${{ env.FFMPEG_VERSION }}-${{ env.ANDROID_NDK_VERSION }}-${{ hashFiles('scripts/build-android-ffmpeg.sh') }}
          restore-keys: |
            android-ffmpeg-${{ env.FFMPEG_VERSION }}-${{ env.ANDROID_NDK_VERSION }}-

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-${ANDROID_API_LEVEL}" "build-tools;${ANDROID_BUILD_TOOLS}" "ndk;${ANDROID_NDK_VERSION}"

      - name: Install Android FFmpeg build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            ca-certificates \
            nasm \
            yasm

      - name: Build Android FFmpeg bundle
        run: |
          bash ./scripts/build-android-ffmpeg.sh

      - name: Install local music notification package dependencies
        working-directory: vendor/tauri-plugin-music-notification
        run: npm ci

      - name: Build local music notification package
        working-directory: vendor/tauri-plugin-music-notification
        run: npm run build

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Android release packages
        run: bash ./build-android.sh

      - name: Upload Android bundles to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            frontend/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
            frontend/src-tauri/gen/android/app/build/outputs/bundle/**/*.aab
