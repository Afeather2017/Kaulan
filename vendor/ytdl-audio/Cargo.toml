[package]
name = "ytdl-audio"
version = "0.1.0"
edition = "2024"
description = "Download YouTube audio, subtitles, and thumbnails"
license = "MIT"

[lib]
name = "ytdl_audio"
path = "src/lib.rs"

[[bin]]
name = "ytdl-audio"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "cookies", "rustls-tls-native-roots"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
urlencoding = "2"
